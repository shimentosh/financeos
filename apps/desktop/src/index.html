<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Wise</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --card: #ffffff;
        --fg: #171717;
        --muted: #737373;
        --border: #e5e5e5;
        --primary: #262626;
        --primary-fg: #fafafa;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171717;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --primary: #fafafa;
          --primary-fg: #171717;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 "Geist", "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
      .brand svg { width: 32px; height: 32px; }
      h1 { margin: 0; font-size: 16px; font-weight: 600; }
      p { margin: 0 0 16px; color: var(--muted); }
      label { display: block; margin-bottom: 6px; font-weight: 500; }
      input {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
      button {
        width: 100%;
        height: 36px;
        margin-top: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { min-height: 21px; margin: 10px 0 0; }
      .status.error { color: var(--danger); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#262626"/><path d="M9 11.5A2.5 2.5 0 0 1 11.5 9h9A2.5 2.5 0 0 1 23 11.5V13h-6a3 3 0 0 0 0 6h6v1.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 9 20.5z" fill="#fafafa"/><circle cx="17.5" cy="16" r="1.25" fill="#262626"/><path d="M17 14.5h6.5v3H17a1.5 1.5 0 0 1 0-3z" fill="#fafafa"/></svg>
        <h1>Expense Wise</h1>
      </div>

      <form id="form" hidden>
        <p>Connect to your Expense Wise server. Your books stay on that server; this app is a window onto it.</p>
        <label for="url">Server address</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://books.example.com" required />
        <button id="submit" type="submit">Connect</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite">Connecting…</p>
    </main>

    <script>
      const { invoke } = window.__TAURI__.core;
      const form = document.getElementById("form");
      const input = document.getElementById("url");
      const submit = document.getElementById("submit");
      const statusEl = document.getElementById("status");

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", isError);
      }

      function normalize(value) {
        const trimmed = value.trim().replace(/\/+$/, "");
        return /^[a-z]+:\/\//i.test(trimmed) ? trimmed : `http://${trimmed}`;
      }

      // Opaque (no-cors) request: we only need to know the server answers.
      async function reachable(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        try {
          await fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      async function connect(value) {
        const url = normalize(value);
        submit.disabled = true;
        setStatus(`Connecting to ${url}…`);
        if (!(await reachable(url))) {
          form.hidden = false;
          submit.disabled = false;
          setStatus(`Can't reach ${url}. Check the address and that the server is running.`, true);
          return;
        }
        try {
          await invoke("connect", { url });
        } catch (error) {
          form.hidden = false;
          submit.disabled = false;
          setStatus(String(error), true);
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        connect(input.value);
      });

      (async () => {
        const saved = await invoke("get_server_url");
        input.value = saved;
        const changing = new URLSearchParams(location.search).has("change");
        if (changing) {
          form.hidden = false;
          setStatus("");
          input.focus();
          input.select();
        } else {
          connect(saved);
        }
      })();
    </script>
  </body>
</html>
