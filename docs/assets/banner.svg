<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="FinanceOS — open-source AI financial operating system for personal and business money">
  <title>FinanceOS — open-source AI financial operating system</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(88 92) scale(2.5)">
    <rect width="32" height="32" rx="8" fill="#fafafa"/>
    <path d="M9 11.5A2.5 2.5 0 0 1 11.5 9h9A2.5 2.5 0 0 1 23 11.5V13h-6a3 3 0 0 0 0 6h6v1.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 9 20.5z" fill="#171717"/>
    <circle cx="17.5" cy="16" r="1.25" fill="#fafafa"/>
    <path d="M17 14.5h6.5v3H17a1.5 1.5 0 0 1 0-3z" fill="#171717"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="196" y="150" fill="#fafafa" font-size="64" font-weight="700" letter-spacing="-1.5">FinanceOS</text>
    <text x="88" y="232" fill="#d4d4d4" font-size="30" font-weight="500">The open-source AI financial operating system</text>
    <text x="88" y="274" fill="#a3a3a3" font-size="22">Personal + business money · double-entry ledger · AI that drafts, you decide</text>

    <!-- flow pills -->
    <g font-size="18" font-weight="600">
      <rect x="88" y="310" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="148" y="336" fill="#fafafa" text-anchor="middle">Capture</text>
      <text x="226" y="336" fill="#525252" text-anchor="middle">→</text>
      <rect x="244" y="310" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="304" y="336" fill="#fafafa" text-anchor="middle">Connect</text>
      <text x="382" y="336" fill="#525252" text-anchor="middle">→</text>
      <rect x="400" y="310" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="475" y="336" fill="#fafafa" text-anchor="middle">Understand</text>
      <text x="568" y="336" fill="#525252" text-anchor="middle">→</text>
      <rect x="586" y="310" width="96" height="40" rx="20" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.6"/>
      <text x="634" y="336" fill="#6ee7b7" text-anchor="middle">Act</text>
    </g>
  </g>

  <!-- mini ledger card -->
  <g transform="translate(880 96)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="312" height="224" rx="16" fill="#171717" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="40" fill="#a3a3a3" font-size="14" font-weight="600">NET WORTH</text>
    <text x="24" y="78" fill="#fafafa" font-size="32" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">৳ 4,82,150</text>
    <polyline points="24,140 64,128 104,132 144,112 184,116 224,96 264,90 288,78" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="160" x2="288" y2="160" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="188" fill="#d4d4d4" font-size="14">Figma · renewal in 7 days</text>
    <text x="288" y="188" fill="#fca5a5" font-size="14" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">−$144.00</text>
    <text x="24" y="210" fill="#d4d4d4" font-size="14">Stripe payout</text>
    <text x="288" y="210" fill="#6ee7b7" font-size="14" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">+$2,340.00</text>
  </g>
</svg>
